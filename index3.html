<style>
  :root{
    --void:#0b0716;
    --accent:#8b75ff;
    --accent-soft:#a594ff;
    --warm:#ffb56b;
    --bone:#f4f1fb;
    --lav:#9b92c4;
    --display:'Archivo Black', sans-serif;
    --body:'Work Sans', sans-serif;
  }
  body.m2{
    --void:#060b1a;
    --accent:#5ee6ff;
    --accent-soft:#8fd9ff;
    --warm:#9bf0ff;
    --lav:#8fa3c9;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:var(--body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}
  a{color:inherit}
  button{font-family:inherit}

  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #spacer{position:relative;width:100%;pointer-events:none}

  /* ---------- world-anchored text ---------- */
  #anchors{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .anchor{
    position:absolute;left:0;top:0;
    transform-origin:center center;
    will-change:transform,opacity;
    opacity:0;text-align:center;pointer-events:none;
  }
  .anchor .eyebrow{
    font-weight:600;letter-spacing:.42em;text-transform:uppercase;
    font-size:13px;color:var(--accent-soft);margin-bottom:18px;
  }
  .anchor h2{
    font-family:var(--display);font-size:64px;line-height:1.02;letter-spacing:-.01em;
    text-shadow:0 0 60px color-mix(in srgb, var(--accent) 55%, transparent), 0 0 18px color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .anchor .sub{
    font-size:19px;line-height:1.55;color:var(--lav);
    max-width:560px;margin:22px auto 0;font-weight:400;
  }
  .anchor.hero h2{font-size:88px}
  .anchor .stat{
    font-family:var(--display);font-size:44px;color:var(--warm);
    text-shadow:0 0 40px color-mix(in srgb, var(--warm) 55%, transparent);
  }
  .anchor .statlabel{
    font-size:14px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--lav);margin-top:10px;font-weight:500;
  }
  .anchor .capth{
    font-weight:600;font-size:17px;color:var(--bone);margin-top:16px;letter-spacing:.01em;
  }
  .anchor .captp{
    font-size:13px;line-height:1.55;color:var(--lav);max-width:320px;margin:8px auto 0;
  }
  .anchor .name{font-family:var(--display);font-size:26px;letter-spacing:.02em}
  .anchor .role{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--lav);margin-top:8px;font-weight:500}
  .anchor .word{
    font-family:var(--display);font-size:30px;color:var(--accent-soft);
    text-shadow:0 0 40px color-mix(in srgb, var(--accent) 60%, transparent);letter-spacing:.02em;
  }
  .anchor .nodelabel{
    font-size:14px;letter-spacing:.3em;text-transform:uppercase;color:var(--bone);font-weight:600;
    text-shadow:0 0 24px color-mix(in srgb, var(--accent) 80%, transparent);
  }
  .anchor .cta{
    pointer-events:auto;display:inline-block;margin-top:34px;
    font-weight:600;font-size:15px;letter-spacing:.22em;text-transform:uppercase;
    color:#10081f;background:var(--warm);border-radius:999px;
    padding:18px 42px;text-decoration:none;
    box-shadow:0 0 60px color-mix(in srgb, var(--warm) 50%, transparent);
    transition:transform .25s ease, box-shadow .25s ease, filter .25s ease;
  }
  .anchor .cta:hover{transform:translateY(-2px);filter:brightness(1.1);box-shadow:0 0 90px color-mix(in srgb, var(--warm) 80%, transparent)}
  .anchor .cta:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
  .anchor .footlinks{
    pointer-events:auto;margin-top:26px;font-size:14px;letter-spacing:.18em;
    text-transform:uppercase;font-weight:500;color:var(--lav);
  }
  .anchor .footlinks a{
    color:var(--accent-soft);text-decoration:none;margin:0 12px;
    border-bottom:1px solid color-mix(in srgb, var(--accent-soft) 35%, transparent);padding-bottom:3px;
  }
  .anchor .footlinks a:hover{color:var(--bone);border-color:var(--bone)}
  .anchor .legal{
    margin-top:26px;font-size:12px;color:color-mix(in srgb, var(--lav) 55%, transparent);
    letter-spacing:.05em;max-width:460px;margin-left:auto;margin-right:auto;line-height:1.6;
  }

  /* ---------- chrome ---------- */
  #chrome{position:fixed;inset:0;z-index:5;pointer-events:none}
  #brand{
    position:absolute;top:calc(26px + env(safe-area-inset-top, 0px));left:calc(28px + env(safe-area-inset-left, 0px));
    pointer-events:auto;display:flex;align-items:center;gap:12px;cursor:pointer;background:none;border:none;
  }
  #brand img{height:26px;display:block;filter:drop-shadow(0 0 14px color-mix(in srgb, var(--accent) 60%, transparent))}
  #topright{
    position:absolute;top:calc(22px + env(safe-area-inset-top, 0px));right:calc(24px + env(safe-area-inset-right, 0px));
    pointer-events:auto;display:flex;align-items:center;gap:10px;
  }
  .pill{
    background:rgba(16,12,34,.55);
    border:1px solid color-mix(in srgb, var(--accent-soft) 30%, transparent);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--bone);border-radius:999px;
    font-weight:600;font-size:12px;letter-spacing:.2em;text-transform:uppercase;
    padding:12px 20px;cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .pill:hover{border-color:var(--accent-soft);background:rgba(34,26,66,.6)}
  .pill:focus-visible{outline:2px solid var(--warm);outline-offset:2px}
  #progress{position:absolute;left:0;bottom:0;height:3px;width:100%;background:rgba(155,146,196,.12)}
  #progress i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--accent),var(--warm));
    box-shadow:0 0 14px color-mix(in srgb, var(--warm) 60%, transparent);
  }
  #hint{
    position:absolute;bottom:calc(34px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--lav);
    font-weight:600;opacity:0;transition:opacity 1s ease;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  #hint::after{
    content:"";width:1px;height:34px;
    background:linear-gradient(180deg,var(--accent-soft),transparent);
    animation:drip 2s ease-in-out infinite;
  }
  @keyframes drip{0%{transform:scaleY(.2);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:top;opacity:0}}

  /* station dots (concept 2) */
  #dots{
    position:absolute;right:calc(16px + env(safe-area-inset-right, 0px));top:50%;transform:translateY(-50%);
    display:none;flex-direction:column;gap:12px;pointer-events:auto;
  }
  body.m2 #dots{display:flex}
  #dots button{
    width:9px;height:9px;border-radius:50%;cursor:pointer;
    border:1px solid color-mix(in srgb, var(--accent-soft) 60%, transparent);
    background:transparent;padding:0;transition:background .25s ease, transform .25s ease;
  }
  #dots button.on{background:var(--accent);transform:scale(1.35);box-shadow:0 0 12px var(--accent)}
  #dots button:focus-visible{outline:2px solid var(--warm);outline-offset:2px}

  /* ---------- menu ---------- */
  #menu{
    position:fixed;inset:0;z-index:8;background:color-mix(in srgb, var(--void) 94%, transparent);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    opacity:0;visibility:hidden;transition:opacity .35s ease, visibility .35s;
  }
  #menu.open{opacity:1;visibility:visible}
  #menu nav{display:flex;flex-direction:column;align-items:center;gap:6px}
  #menu nav button{
    background:none;border:none;cursor:pointer;
    font-family:var(--display);font-size:34px;color:var(--bone);
    padding:8px 16px;letter-spacing:.01em;transition:color .2s ease, text-shadow .2s ease;
  }
  #menu nav button:hover{color:var(--warm);text-shadow:0 0 40px color-mix(in srgb, var(--warm) 60%, transparent)}
  #menu nav button:focus-visible{outline:2px solid var(--warm);outline-offset:4px}
  #menu .ext{
    margin-top:36px;display:flex;gap:24px;flex-wrap:wrap;justify-content:center;
    font-size:13px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;
  }
  #menu .ext a, #menu .ext button.lnk{
    color:var(--accent-soft);text-decoration:none;background:none;border:none;cursor:pointer;
    border-bottom:1px solid color-mix(in srgb, var(--accent-soft) 30%, transparent);padding:0 0 4px;
    font:inherit;letter-spacing:inherit;text-transform:inherit;
  }
  #menu .ext a:hover, #menu .ext button.lnk:hover{color:var(--bone)}
  #menuclose{position:absolute;top:calc(22px + env(safe-area-inset-top,0px));right:calc(24px + env(safe-area-inset-right,0px))}

  /* ---------- enter / landing ---------- */
  #enter{
    position:fixed;inset:0;z-index:10;
    background:radial-gradient(120% 90% at 50% 110%, #1c1038 0%, #0b0716 60%);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    transition:opacity 1.4s ease, visibility 1.4s;
  }
  #enter.gone{opacity:0;visibility:hidden}
  #enter img{height:54px;filter:drop-shadow(0 0 30px rgba(139,117,255,.7));margin-bottom:34px}
  #enter .tag{
    font-size:13px;letter-spacing:.45em;text-transform:uppercase;
    color:#9b92c4;font-weight:600;margin-bottom:46px;text-align:center;line-height:2;
  }
  .beginbtn{
    background:none;color:#f4f1fb;
    border:1px solid rgba(165,148,255,.5);
    border-radius:999px;padding:18px 58px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:7px;
    transition:all .3s ease;min-width:300px;
  }
  .beginbtn + .beginbtn{margin-top:16px}
  .beginbtn .big{
    font-weight:600;font-size:14px;letter-spacing:.35em;text-transform:uppercase;
  }
  .beginbtn .small{
    font-size:11px;letter-spacing:.22em;text-transform:uppercase;
    color:#9b92c4;font-weight:500;transition:color .3s ease;
  }
  .beginbtn:hover{background:#8b75ff;border-color:#8b75ff;box-shadow:0 0 70px rgba(139,117,255,.7)}
  .beginbtn:hover .small{color:rgba(255,255,255,.85)}
  .beginbtn.c2:hover{background:#1ba8c9;border-color:#1ba8c9;box-shadow:0 0 70px rgba(94,230,255,.55)}
  .beginbtn:focus-visible{outline:2px solid #ffb56b;outline-offset:4px}
  #enter .soundnote{margin-top:30px;font-size:12px;color:rgba(155,146,196,.7);letter-spacing:.15em;text-transform:uppercase;font-weight:500}

  /* ---------- responsive ---------- */
  @media (max-width:740px){
    .anchor h2{font-size:38px}
    .anchor.hero h2{font-size:46px}
    .anchor .sub{font-size:16px;max-width:82vw;margin-top:16px}
    .anchor .stat{font-size:30px}
    .anchor .capth{font-size:15px;margin-top:12px}
    .anchor .captp{font-size:12px;max-width:74vw}
    .anchor .word{font-size:20px}
    .anchor .name{font-size:18px}
    .anchor .role{font-size:10px;letter-spacing:.16em}
    .anchor .nodelabel{font-size:10px;letter-spacing:.2em}
    .anchor .eyebrow{font-size:10px;letter-spacing:.32em;margin-bottom:12px}
    .anchor .cta{padding:15px 32px;font-size:13px;margin-top:24px}
    #brand img{height:20px}
    .pill{padding:10px 15px;font-size:11px}
    #menu nav button{font-size:26px}
    #enter img{height:40px}
    #enter .tag{font-size:11px;letter-spacing:.35em;padding:0 24px}
    .beginbtn{min-width:260px;padding:16px 40px}
  }
  @media (prefers-reduced-motion:reduce){
    #hint::after{animation:none}
  }
</style>
</head>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

/* ============================================================
   PUSH — two immersive concepts
   Concept 1 "The Brave Brand" — free scroll through violet fog
   Concept 2 "The Machine"     — station-flight through a system
   ============================================================ */

const PREFERS_REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IS_MOBILE = Math.min(window.innerWidth, window.innerHeight) < 740;
const IS_TOUCH = 'ontouchstart' in window;

const AUDIO_TRACKS = {
  1: 'https://res.cloudinary.com/du8ydfy3a/video/upload/q_auto/f_auto/v1781048274/Starlit_Threshold_bdueqy.mp3',
  2: 'https://res.cloudinary.com/du8ydfy3a/video/upload/q_auto/f_auto/v1781051088/Orbit_Relay_qiovsk.mp3',
};

const cld = (url, t) => url.replace('/upload/', '/upload/' + t + '/');

const LOREM_H = ['Lorem ipsum dolor sit amet', 'Consectetur adipiscing elit', 'Sed do eiusmod tempor', 'Ut enim ad minim veniam'];
const LOREM_P = 'Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.';

const WORK = [
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047082/work1_hdryd4.jpg', stat:'+574%', label:'Click-through rate' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work2_frxuy3.jpg', stat:'−96%', label:'Cost per store visit' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work3_yh4pre.jpg', stat:'+250%', label:'Engagement' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work4_fkkhtr.jpg', stat:'−30%', label:'Cost per lead' },
];
const TEAM = [
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/1Kyle_qyyreh.jpg',  name:'Kyle',   role:'Founder & CEO' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/2Braden_o5zjxc.jpg', name:'Braden', role:'Chief Operating Officer' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/3Julie_bnwir1.jpg',  name:'Julie',  role:'President' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/4Jason_dqbdkn.jpg',  name:'Jason',  role:'Chief Strategy Officer' },
];
const CLIENT_LOGOS = [
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047479/1logo_gmjppp.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047479/2logo_vvykjx.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047478/3logo_gxtcej.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047478/4logo_oll2yb.png',
];

/* ---------- shared renderer / scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.6 : 1.8));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(IS_MOBILE ? 70 : 58, window.innerWidth/window.innerHeight, 0.1, 1600);

function radialTexture(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0, inner); grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0,0,256,256);
  return new THREE.CanvasTexture(c);
}
const TEX_GLOW_WARM   = radialTexture('rgba(255,196,140,1)','rgba(255,150,80,0)');
const TEX_GLOW_PURPLE = radialTexture('rgba(180,160,255,1)','rgba(120,90,255,0)');
const TEX_GLOW_CYAN   = radialTexture('rgba(190,245,255,1)','rgba(60,190,255,0)');
const TEX_GLOW_SOFT   = radialTexture('rgba(255,255,255,1)','rgba(255,255,255,0)');

const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
function loadTex(url, cb){
  texLoader.load(url, (t)=>{ t.colorSpace = THREE.SRGBColorSpace; if(cb) cb(t); }, undefined, ()=>{});
}

/* ---------- shared anchor engine ---------- */
const anchorRoot = document.getElementById('anchors');
const anchors = [];
function addAnchor({x=0, y=4, z, html, cls='', range=80, base=18, maxScale=1.9}){
  const el = document.createElement('div');
  el.className = 'anchor ' + cls;
  el.innerHTML = html;
  anchorRoot.appendChild(el);
  anchors.push({ el, pos:new THREE.Vector3(x,y,z), range, base, maxScale });
  return el;
}
function addAnchorAt(v, opts){ return addAnchor({ ...opts, x:v.x, y:v.y, z:v.z }); }

/* floaters = gently bobbing objects {obj, baseY, seed, amp} */
const floaters = [];

function addPanel({url, pos, lookAt=null, w, h, rotY=0, glowTex=TEX_GLOW_PURPLE, glowColor=0x8b75ff, glowOp=0.4, bob=0.35}){
  const group = new THREE.Group();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, color:glowColor, transparent:true, opacity:glowOp, blending:THREE.AdditiveBlending, depthWrite:false }));
  glow.scale.set(w*2.1, h*2.3, 1);
  glow.position.z = -0.5;
  group.add(glow);
  const mat = new THREE.MeshBasicMaterial({ color:0x1b1733 });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
  group.add(mesh);
  loadTex(url, (t)=>{ mat.map = t; mat.color.set(0xffffff); mat.needsUpdate = true; });
  group.position.copy(pos);
  if (lookAt) group.lookAt(lookAt.x, pos.y, lookAt.z);
  else group.rotation.y = rotY;
  scene.add(group);
  floaters.push({ obj:group, baseY:pos.y, seed:Math.random()*6, amp:bob });
  return group;
}

function workCaptionHTML(i){
  return `
    <div class="stat">${WORK[i].stat}</div>
    <div class="statlabel">${WORK[i].label}</div>
    <div class="capth">${LOREM_H[i]}</div>
    <div class="captp">${LOREM_P}</div>
  `;
}

/* ---------- shared chrome refs ---------- */
const menu = document.getElementById('menu');
const menulinks = document.getElementById('menulinks');

   ============================================================ */
const C1 = { Z_START:10, Z_END:-660, HORIZON_Z:-900 };
let c1 = null;

function buildConcept1(){

  camera.position.set(0, 2.6, C1.Z_START);

  const W = { runway:[], orbs:[], particles:null, horizon:null };

  // ground

    ground.position.set(0, -5.5, -500);

  // horizon dawn
  {

    horizon.position.set(0, 24, C1.HORIZON_Z);
    scene.add(horizon);
    W.horizon = { core, halo };
  }

  // runway lights
  for (let z = 0; z > C1.HORIZON_Z + 60; z -= 11){
    const side = (W.runway.length % 2 === 0) ? 1 : -1;

    s.scale.set(1.6,1.6,1);
    s.position.set(side * (2.6 + Math.sin(z*0.02)*0.5), -4.9, z);

  // particles
  {

    const pos = new Float32Array(COUNT*3);

      seeds[i] = Math.random()*Math.PI*2;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    W.particles = new THREE.Points(geo, new THREE.PointsMaterial({

    W.particles.userData.seeds = seeds;
    scene.add(W.particles);

  // depth orbs
  {
    const OXF = IS_MOBILE ? 0.55 : 1;
    const spots = [[-18,9,-90,7,0x8b75ff,.22],[22,14,-150,10,0xffb56b,.15],[-26,7,-300,9,0x8b75ff,.18],[20,11,-430,8,0xffb56b,.14],[-16,12,-560,11,0x8b75ff,.2]];

      sp.position.set(x*OXF,y,z);

      scene.add(sp); W.orbs.push(sp);

  // method constellation
  const NXF = IS_MOBILE ? 0.45 : 1;
  const NODE_POINTS = [
    new THREE.Vector3(-9*NXF, 2.5, -178),
    new THREE.Vector3(-3.5*NXF, 5.2, -183),

    const n = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_PURPLE, color:0xb9aaff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));

  scene.add(new THREE.Mesh(
    new THREE.TubeGeometry(new THREE.CatmullRomCurve3(NODE_POINTS), 48, 0.045, 6, false),
    new THREE.MeshBasicMaterial({ color:0x8b75ff, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false })
  ));

  // work panels
  const PANEL_X = IS_MOBILE ? 4.4 : 10.5;
  const PANEL_W = IS_MOBILE ? 8.6 : 15;
  const PANEL_H = PANEL_W * 9/16;
  const PANEL_ROT = IS_MOBILE ? 0.55 : 0.42;
  WORK.forEach((wk, i)=>{
    const side = i % 2 === 0 ? -1 : 1;
    addPanel({
      url: cld(wk.url, 'c_fill,w_1280,h_720'),
      pos: new THREE.Vector3(side*PANEL_X, 4.6, -262 - i*34),
      w: PANEL_W, h: PANEL_H,
      rotY: side * -PANEL_ROT,
    });
  });

  // client logos
  CLIENT_LOGOS.forEach((url, i)=>{
    const side = i % 2 === 0 ? 1 : -1;
    const LXF = IS_MOBILE ? 0.45 : 1;
    const mat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0.92, depthWrite:false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
    mesh.position.set(side*(6+i*1.3)*LXF, 5.5 + (i%2)*2.2, -402 - i*7);
    mesh.rotation.y = side * -0.3;
    mesh.visible = false;
    loadTex(url, (t)=>{
      const ar = (t.image && t.image.width) ? t.image.width / t.image.height : 3;
      const w = 4.6;
      mesh.scale.set(w, w/ar, 1);
      mat.map = t; mat.needsUpdate = true; mesh.visible = true;
    });
    scene.add(mesh);
    floaters.push({ obj:mesh, baseY:mesh.position.y, seed:Math.random()*6, amp:0.5 });
  });

  // leadership
  const TEAM_LAYOUT = IS_MOBILE
    ? [ { x:-2.7, z:-510 }, { x:2.7, z:-522 }, { x:-2.7, z:-534 }, { x:2.7, z:-546 } ]
    : [ { x:-12.5, z:-518 }, { x:-4.2, z:-522 }, { x:4.2, z:-522 }, { x:12.5, z:-518 } ];
  const PORTRAIT_W = IS_MOBILE ? 4.3 : 6.2;
  const PORTRAIT_H = PORTRAIT_W * 1.25;
  TEAM.forEach((m, i)=>{
    const L = TEAM_LAYOUT[i];
    addPanel({
      url: cld(m.url, 'c_fill,g_face,w_600,h_750'),
      pos: new THREE.Vector3(L.x, 4.4, L.z),
      w:PORTRAIT_W, h:PORTRAIT_H,
      rotY: L.x > 0 ? -0.22 : 0.22,
      glowOp:0.32,
    });
  });

  // contact beacon
  {
    const beacon = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_WARM, color:0xffb56b, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false }));
    beacon.scale.set(46,46,1);
    beacon.position.set(0, 8, -636);
    scene.add(beacon);
    floaters.push({ obj:beacon, baseY:8, seed:1.7, amp:0.6 });
  }

  /* --- anchors --- */
  addAnchor({ z:-44, y:4.6, cls:'hero', html:`
    <h2>Brave is<br/>a strategy.</h2>
    <div class="sub">We give bold brands the intelligence to go further and waste nothing.</div>
  `});
  addAnchor({ z:-116, y:4.6, html:`
    <div class="eyebrow">What we do</div>
    <h2>One system behind<br/>every bold move.</h2>
    <div class="sub">Media, creative, and intelligence, connected — so courage never travels alone.</div>
  `});
  addAnchor({ z:-176, y:9.5, html:`
    <div class="eyebrow">How we do it</div>
    <h2>Bold, not blind.</h2>
    <div class="sub">Intelligence behind every decision. Conviction behind every move. Lorem ipsum dolor sit amet, consectetur adipiscing elit.</div>
  `});
  const NODE_LABELS = ['Big Idea','Optimization','Intelligence','Human Brilliance'];
  NODE_POINTS.forEach((p, i)=>{
    addAnchor({ x:p.x, y:p.y-1.7, z:p.z, range:46, base:14, maxScale:1.2, html:`<div class="nodelabel">${NODE_LABELS[i]}</div>` });
  });
  addAnchor({ z:-242, y:5, html:`
    <div class="eyebrow">Our work</div>
    <h2>What bravery returns.</h2>
    <div class="sub">The brands that went first, and the numbers that followed.</div>
  `});
  WORK.forEach((wk, i)=>{
    const side = i % 2 === 0 ? -1 : 1;
    addAnchor({ x: side*PANEL_X, y: 4.6 - PANEL_H/2 - 1.6, z:-262 - i*34, range:55, base:15, maxScale:1.4, html: workCaptionHTML(i) });
  });
  addAnchor({ z:-446, y:5, html:`
    <div class="eyebrow">Capabilities</div>
    <h2>Equipped to go first.</h2>
    <div class="sub">Strategy, media, creative, intelligence. The full kit, none of the drag. Lorem ipsum dolor sit amet, consectetur.</div>
  `});
  const CWF = IS_MOBILE ? 0.42 : 1;
  [
    { w:'Strategy', x:-11*CWF, y:8.5, z:-462 }, { w:'Media', x:10*CWF, y:2.2, z:-468 },
    { w:'Creative', x:-9*CWF, y:1.6, z:-476 }, { w:'Intelligence', x:11*CWF, y:8.8, z:-482 },
  ].forEach(c=>{
    addAnchor({ x:c.x, y:c.y, z:c.z, range:50, base:15, maxScale:1.35, html:`<div class="word">${c.w}</div>` });
  });
  addAnchor({ z:-500, y:9.6, html:`
    <div class="eyebrow">Leadership</div>
    <h2>People who push back.</h2>
    <div class="sub">Senior operators who challenge the brief and back the bold call.</div>
  `});
  TEAM.forEach((m, i)=>{
    const L = TEAM_LAYOUT[i];
    addAnchor({ x:L.x, y: 4.4 - PORTRAIT_H/2 - 1.3, z:L.z, range:50, base:14, maxScale:1.3, html:`
      <div class="name">${m.name}</div>
      <div class="role">${m.role}</div>
    `});
  });
  addAnchor({ z:-606, y:5, html:`
    <div class="eyebrow">Contact</div>
    <h2>Your move.</h2>
    <div class="sub">One conversation. That's how every brave brand starts.</div>
    <a class="cta" href="https://push.agency/contact/" target="_blank" rel="noopener">Start the conversation</a>
  `});
  addAnchor({ z:-648, y:4.6, range:60, html:`
    <h2 style="font-size:42px">Brave, coast to coast.</h2>
    <div class="sub" style="margin-top:14px">A North American footprint with the nerve to go anywhere.</div>
    <div class="footlinks">
      <a href="https://push.agency/news/" target="_blank" rel="noopener">PUSH News</a>·
      <a href="https://push.agency/push-post/" target="_blank" rel="noopener">PUSH Post</a>·
      <a href="https://push.agency/" target="_blank" rel="noopener">push.agency</a>
    </div>
    <div class="legal">Lorem ipsum dolor sit amet, consectetur adipiscing elit. © PUSH. An immersive experience concept.</div>
  `});

  /* --- menu --- */
  const SECTIONS = [
    { label:'What We Do',   z:-116 },
    { label:'How We Do It', z:-176 },
    { label:'Our Work',     z:-242 },
    { label:'Capabilities', z:-446 },
    { label:'Leadership',   z:-500 },
    { label:'Contact',      z:-606 },
  ];
  SECTIONS.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.label;
    b.addEventListener('click', ()=>{
      menu.classList.remove('open');
      const camZ = s.z + 26;
      const p = Math.max(0, Math.min(1, (C1.Z_START - camZ) / (C1.Z_START - C1.Z_END)));
      window.scrollTo({ top: p * maxScroll(), behavior: PREFERS_REDUCED ? 'auto' : 'smooth' });
    });
    menulinks.appendChild(b);
  });
  document.getElementById('brand').addEventListener('click', ()=>{
    menu.classList.remove('open');
    window.scrollTo({ top:0, behavior: PREFERS_REDUCED ? 'auto' : 'smooth' });
  });

  /* --- scroll engine --- */
  function maxScroll(){ return spacer.offsetHeight - window.innerHeight; }
  function sizeSpacer(){ spacer.style.height = Math.round(window.innerHeight * (IS_MOBILE ? 16 : 14)) + 'px'; }
  sizeSpacer();
  let targetP = 0, currentP = 0;
  window.addEventListener('scroll', ()=>{
    const m = maxScroll();
    targetP = m > 0 ? Math.min(1, Math.max(0, window.scrollY / m)) : 0;
    lastMove = performance.now();
    hint.style.opacity = 0;
  }, { passive:true });
  window.addEventListener('resize', sizeSpacer);

  const SWAY = IS_MOBILE ? 1.1 : 2.2;
  const pathX = z => Math.sin(z * 0.012) * SWAY;
  const LERP = IS_MOBILE ? 0.05 : 0.065;

  c1 = {
    update(t, dt){
      currentP += (targetP - currentP) * LERP;
      if (Math.abs(targetP - currentP) < 0.00005) currentP = targetP;
      const camZ = C1.Z_START + (C1.Z_END - C1.Z_START) * currentP;
      progress = currentP;

      camera.position.z = camZ;
      camera.position.x = pathX(camZ) + px * 1.4;
      camera.position.y = 2.6 + (PREFERS_REDUCED ? 0 : Math.sin(t*0.4)*0.12) - py * 0.7;
      camera.lookAt(pathX(camZ - 40), 3.4 - py * 1.2, camZ - 40);

      if (!PREFERS_REDUCED){
        const pos = W.particles.geometry.attributes.position;
        const seeds = W.particles.userData.seeds;
        for (let i=0;i<pos.count;i++){
          let y = pos.getY(i) + dt * 0.35;
          if (y > 30) y = -5;
          pos.setY(i, y);
          pos.setX(i, pos.getX(i) + Math.sin(t*0.3 + seeds[i]) * 0.004);
        }
        pos.needsUpdate = true;
        for (const s of W.runway) s.material.opacity = 0.55 + Math.sin(t*1.4 + s.userData.seed) * 0.3;
        for (const o of W.orbs) o.position.y += Math.sin(t*0.25 + o.userData.seed) * 0.002;
        W.horizon.core.material.opacity = 0.75 + currentP*0.25 + Math.sin(t*0.6)*0.05;
        W.horizon.halo.material.opacity = 0.35 + currentP*0.25;
      }
      return camZ;
    }
  };
}

/* ============================================================
   CONCEPT 2 — THE MACHINE (station flight through the system)
   ============================================================ */
let c2 = null;

function buildConcept2(){
  document.body.classList.add('m2');
  scene.background = new THREE.Color(0x060b1a);
  scene.fog = new THREE.FogExp2(0x081226, 0.0105);

  /* --- THE MACHINE: one colossal structure you orbit, then enter --- */
  const M = new THREE.Vector3(0, 9, -50);      // machine center
  const D2R = Math.PI / 180;
  const polar = (az, R, y) => new THREE.Vector3(
    M.x + Math.sin(az*D2R)*R, y, M.z + Math.cos(az*D2R)*R
  );
  const tangentAt = az => new THREE.Vector3(Math.cos(az*D2R), 0, -Math.sin(az*D2R));

  /* --- content positions docked around the hull --- */
  const HERO_P = polar(0, 36, 8.2);
  const WHAT_P = polar(52, 21, 9.5);
  const HOW_P  = polar(112, 21, 12);
  const WORK_AZ = [172, 217, 262, 307];
  const PW = IS_MOBILE ? 8.0 : 13;
  const PH = PW * 9/16;
  const workP = WORK_AZ.map((az,i)=> polar(az, 26, i%2 ? 8.5 : 6));
  const LEAD_AZ = 425;
  const LEAD_P = polar(LEAD_AZ, 23, 5.2);
  const CTA_P = polar(470+180, 6.5, 8.4);      // inside, opposite the entry side

  /* --- stations: camera position + what the camera gazes at --- */
  const ST = [
    { cam: polar(0,   110, 7),  look: M.clone() },                      // 0 far outside
    { cam: polar(0,    62, 6),  look: M.clone().setY(8.5) },            // 1 hero approach
    { cam: polar(52,   40, 9),  look: WHAT_P },                          // 2 what
    { cam: polar(112,  38, 13), look: HOW_P },                           // 3 how
    { cam: polar(172,  42, 6),  look: workP[0] },                        // 4 output 1
    { cam: polar(217,  42, 9),  look: workP[1] },                        // 5 output 2
    { cam: polar(262,  42, 6),  look: workP[2] },                        // 6 output 3
    { cam: polar(307,  42, 9),  look: workP[3] },                        // 7 output 4
    { cam: polar(355,  46, 19), look: M.clone() },                       // 8 high vantage
    { cam: polar(LEAD_AZ, 36, 5.8), look: LEAD_P },                      // 9 leadership
    { cam: polar(470, 4.5, 9),  look: M.clone() },                       // 10 inside the core
  ];
  const N_ST = ST.length;

  const camCurve = new THREE.CatmullRomCurve3(ST.map(s=>s.cam), false, 'catmullrom', 0.3);
  // arc-length t per station
  const tSt = ST.map(()=>0);
  {
    const SAMPLES = 2200;
    const best = ST.map(()=>Infinity);
    for (let s=0; s<=SAMPLES; s++){
      const tt = s/SAMPLES;
      const p = camCurve.getPointAt(tt);
      for (let i=0;i<N_ST;i++){
        const d = p.distanceToSquared(ST[i].cam);
        if (d < best[i]){ best[i] = d; tSt[i] = tt; }
      }
    }
    tSt[0] = 0; tSt[N_ST-1] = 1;
  }

  /* --- grid floor --- */
  {
    const grid = new THREE.GridHelper(1000, 110, 0x24406e, 0x14223f);
    grid.position.set(M.x, -6, M.z);
    grid.material.transparent = true;
    grid.material.opacity = 0.45;
    scene.add(grid);
  }

  /* --- machine body: nested gyroscope rings + heart + energy column --- */
  const coreRings = [];
  {
    const specs = [
      [8,  0.24, 0x5ee6ff, 'x', 0.28],
      [12, 0.2,  0x8b75ff, 'y', 0.2],
      [16, 0.18, 0x4fd8ff, 'z', 0.14],
      [20, 0.14, 0x8b75ff, 'x', 0.1],
    ];
    for (const [r, tube, col, axis, speed] of specs){
      const m = new THREE.Mesh(
        new THREE.TorusGeometry(r, tube, 12, 110),
        new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false })
      );
      m.userData = { axis, speed };
      m.rotation.set(Math.random()*2, Math.random()*2, Math.random()*2);
      m.position.copy(M);
      scene.add(m); coreRings.push(m);
    }
    const heart = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_CYAN, color:0xeaffff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
    heart.scale.set(22,22,1); heart.position.copy(M); scene.add(heart);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_CYAN, color:0x4fd8ff, transparent:true, opacity:0.38, blending:THREE.AdditiveBlending, depthWrite:false }));
    halo.scale.set(120,120,1); halo.position.copy(M); scene.add(halo);
    // energy column
    for (const [rad, op] of [[1.1, 0.14], [2.8, 0.05]]){
      const col = new THREE.Mesh(
        new THREE.CylinderGeometry(rad, rad, 70, 24, 1, true),
        new THREE.MeshBasicMaterial({ color:0x9fe9ff, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide })
      );
      col.position.copy(M);
      scene.add(col);
    }
  }

  /* --- floating parts orbiting the machine --- */
  const parts = [];
  {
    const COUNT = IS_MOBILE ? 10 : 16;
    for (let i=0;i<COUNT;i++){
      let mesh;
      const kind = i % 3;
      const col = i % 2 ? 0x5ee6ff : 0x8b75ff;
      if (kind === 0){
        mesh = new THREE.Mesh(
          new THREE.TorusGeometry(1.1 + Math.random()*0.7, 0.07, 8, 40),
          new THREE.MeshBasicMaterial({ color:col, transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false })
        );
      } else if (kind === 1){
        mesh = new THREE.LineSegments(
          new THREE.WireframeGeometry(new THREE.OctahedronGeometry(1 + Math.random()*0.8)),
          new THREE.LineBasicMaterial({ color:col, transparent:true, opacity:0.6, blending:THREE.AdditiveBlending })
        );
      } else {
        mesh = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_CYAN, color:col, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false }));
        mesh.scale.set(1.6,1.6,1);
      }
      mesh.userData = {
        R: 23 + Math.random()*9,
        speed: (Math.random()>0.5?1:-1) * (0.05 + Math.random()*0.12),
        phase: Math.random()*Math.PI*2,
        yOff: 3 + Math.random()*13,
        yAmp: 1 + Math.random()*2.5,
        yFreq: 0.2 + Math.random()*0.3,
        spin: 0.2 + Math.random()*0.5,
      };
      scene.add(mesh); parts.push(mesh);
    }
  }

  /* --- gate rings along the flight path --- */
  const rings = [];
  for (let i=1;i<N_ST;i++){
    const midT = (tSt[i-1] + tSt[i]) / 2;
    const p = camCurve.getPointAt(midT);
    const tan = camCurve.getTangentAt(midT);
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(IS_MOBILE ? 6.5 : 9, 0.09, 10, 72),
      new THREE.MeshBasicMaterial({ color: i%2 ? 0x4fd8ff : 0x8b75ff, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    ring.position.copy(p);
    ring.lookAt(p.clone().add(tan));
    ring.userData.spin = (Math.random()>0.5?1:-1) * (0.1 + Math.random()*0.15);
    scene.add(ring); rings.push(ring);
  }

  /* --- data streams flowing into the core --- */
  let stream;
  {
    const COUNT = IS_MOBILE ? 500 : 1100;
    const pos = new Float32Array(COUNT*3);
    const vel = new Float32Array(COUNT);
    for (let i=0;i<COUNT;i++){
      pos[i*3]   = M.x + (Math.random()-0.5)*160;
      pos[i*3+1] = -4 + Math.random()*30;
      pos[i*3+2] = M.z + (Math.random()-0.5)*160;
      vel[i] = 5 + Math.random()*9;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    stream = new THREE.Points(geo, new THREE.PointsMaterial({
      map:TEX_GLOW_SOFT, color:0x9fe9ff, size:0.45, sizeAttenuation:true,
      transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    stream.userData.vel = vel;
    scene.add(stream);
  }

  /* --- content --- */
  const yo = (v, dy) => new THREE.Vector3(v.x, v.y+dy, v.z);

  // 1 — hero (machine looming behind the words)
  addAnchorAt(HERO_P, { cls:'hero', range:64, html:`
    <h2>A new machine<br/>for modern media.</h2>
    <div class="sub">Media, creative, and intelligence — engineered as one system, built for zero waste.</div>
  `});
  // 2 — what
  addAnchorAt(WHAT_P, { range:55, html:`
    <div class="eyebrow">What we do</div>
    <h2>Nothing works<br/>in isolation.</h2>
    <div class="sub">One connected model where every part feeds every other. Lorem ipsum dolor sit amet, consectetur.</div>
  `});
  // 3 — how: module cluster on the hull
  addAnchorAt(yo(HOW_P, 4.4), { range:55, html:`
    <div class="eyebrow">How it runs</div>
    <h2>Insight in.<br/>Action out.</h2>
    <div class="sub">Four modules, one loop, running continuously. Lorem ipsum dolor sit amet.</div>
  `});
  {
    const MODS = ['Big Idea','Optimization','Intelligence','Human Brilliance'];
    const MXF = IS_MOBILE ? 0.45 : 1;
    const tan = tangentAt(112);
    const offs = [-7.5,-2.5,2.5,7.5];
    const pts = offs.map((o,i)=> HOW_P.clone().add(tan.clone().multiplyScalar(o*MXF)).add(new THREE.Vector3(0, -1.6 + (i%2)*1.5, 0)) );
    for (const p of pts){
      const n = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_CYAN, color:0xbdf3ff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
      n.scale.set(3,3,1); n.position.copy(p); scene.add(n);
    }
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 48, 0.04, 6, false),
      new THREE.MeshBasicMaterial({ color:0x5ee6ff, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false })
    ));
    MODS.forEach((m,i)=> addAnchorAt(yo(pts[i], -1.5), { range:42, base:14, maxScale:1.2, html:`<div class="nodelabel">${m}</div>` }));
  }
  // 4–7 — outputs docked on the hull
  WORK.forEach((wk, i)=>{
    const pos = workP[i];
    addPanel({
      url: cld(wk.url, 'c_fill,w_1280,h_720'),
      pos, lookAt: ST[4+i].cam,
      w:PW, h:PH,
      glowTex:TEX_GLOW_CYAN, glowColor:0x4fd8ff, glowOp:0.35, bob:0.18,
    });
    addAnchorAt(yo(pos, -(PH/2) - 1.4), { range:46, base:15, maxScale:1.35, html:`
      <div class="eyebrow" style="margin-bottom:10px">Output 0${i+1}</div>
      ${workCaptionHTML(i)}
    `});
  });
  // client logos near the high vantage
  CLIENT_LOGOS.forEach((url, i)=>{
    const mat = new THREE.MeshBasicMaterial({ transparent:true, opacity:0.9, depthWrite:false });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
    const p = polar(332 + i*15, 27, 12 + (i%2)*3.5);
    mesh.position.copy(p);
    mesh.lookAt(ST[8].cam.x, p.y, ST[8].cam.z);
    mesh.visible = false;
    loadTex(url, (t)=>{
      const ar = (t.image && t.image.width) ? t.image.width / t.image.height : 3;
      mesh.scale.set(4.2, 4.2/ar, 1);
      mat.map = t; mat.needsUpdate = true; mesh.visible = true;
    });
    scene.add(mesh);
    floaters.push({ obj:mesh, baseY:p.y, seed:Math.random()*6, amp:0.4 });
  });
  // 8 — capabilities, seen from above
  addAnchorAt(polar(355, 27, 15.5), { range:58, html:`
    <div class="eyebrow">Capabilities</div>
    <h2>Four disciplines.<br/>One drivetrain.</h2>
    <div class="sub">Strategy, media, creative, intelligence — running as one. Lorem ipsum dolor sit.</div>
  `});
  [['Strategy',337,22,18],['Media',373,22,18],['Creative',347,19.5,11.5],['Intelligence',363,19.5,11.5]].forEach(([w,az,R,y])=>{
    addAnchorAt(polar(az,R,y), { range:50, base:15, maxScale:1.3, html:`<div class="word">${w}</div>` });
  });
  // 9 — leadership on the hull
  addAnchorAt(polar(LEAD_AZ, 23, IS_MOBILE ? 12.2 : 11), { range:52, html:`
    <div class="eyebrow">Leadership</div>
    <h2>The engineers<br/>of the model.</h2>
  `});
  {
    const PRW = IS_MOBILE ? 3.4 : 5.2;
    const PRH = PRW * 1.25;
    const tan = tangentAt(LEAD_AZ);
    const layout = IS_MOBILE
      ? [ {o:-2.2, dy:2.3}, {o:2.2, dy:2.3}, {o:-2.2, dy:-3.2}, {o:2.2, dy:-3.2} ]
      : [ {o:-8, dy:0}, {o:-2.7, dy:0}, {o:2.7, dy:0}, {o:8, dy:0} ];
    TEAM.forEach((m, i)=>{
      const L = layout[i];
      const p = LEAD_P.clone().add(tan.clone().multiplyScalar(L.o));
      p.y += L.dy;
      addPanel({
        url: cld(m.url, 'c_fill,g_face,w_600,h_750'),
        pos:p, lookAt: ST[9].cam,
        w:PRW, h:PRH,
        glowTex:TEX_GLOW_CYAN, glowColor:0x4fd8ff, glowOp:0.28, bob:0.12,
      });
      addAnchorAt(yo(p, -(PRH/2) - 1.0), { range:44, base:13, maxScale:1.2, html:`
        <div class="name">${m.name}</div>
        <div class="role">${m.role}</div>
      `});
    });
  }
  // 10 — inside the core
  addAnchorAt(CTA_P, { range:70, base:16, html:`
    <div class="eyebrow">The core</div>
    <h2>See it run.</h2>
    <div class="sub">One conversation, and we'll show you the machine.</div>
    <a class="cta" href="https://push.agency/contact/" target="_blank" rel="noopener">Start the conversation</a>
    <div class="footlinks">
      <a href="https://push.agency/news/" target="_blank" rel="noopener">PUSH News</a>·
      <a href="https://push.agency/push-post/" target="_blank" rel="noopener">PUSH Post</a>·
      <a href="https://push.agency/" target="_blank" rel="noopener">push.agency</a>
    </div>
    <div class="legal">Built in North America. Runs anywhere. Lorem ipsum dolor sit amet. © PUSH. An immersive experience concept.</div>
  `});

  /* --- menu + dots --- */
  const MENU2 = [
    { label:'What We Do', st:2 }, { label:'How It Runs', st:3 }, { label:'Our Work', st:4 },
    { label:'Capabilities', st:8 }, { label:'Leadership', st:9 }, { label:'The Core', st:10 },
  ];
  MENU2.forEach(s=>{
    const b = document.createElement('button');
    b.textContent = s.label;
    b.addEventListener('click', ()=>{ menu.classList.remove('open'); goTo(s.st); });
    menulinks.appendChild(b);
  });
  document.getElementById('brand').addEventListener('click', ()=>{ menu.classList.remove('open'); goTo(1); });

  const dots = [];
  for (let i=1;i<N_ST;i++){
    const d = document.createElement('button');
    d.setAttribute('aria-label', 'Station ' + i);
    d.addEventListener('click', ()=> goTo(i));
    dotsRoot.appendChild(d); dots.push(d);
  }
  function paintDots(){
    dots.forEach((d, idx)=> d.classList.toggle('on', idx+1 === station));
  }

  /* --- flight engine: animate a float station index, swing the gaze --- */
  let station = 0;
  let sCur = 0;          // float station index 0..N-1
  let anim = null;
  const ease = u => u<0.5 ? 4*u*u*u : 1 - Math.pow(-2*u+2,3)/2;
  const smooth = f => f*f*(3-2*f);

  function goTo(i){
    i = Math.max(0, Math.min(N_ST-1, i));
    if (i === station && !anim) return;
    const hops = Math.abs(i - station);
    anim = { from:sCur, to:i, start:performance.now(), dur: Math.min(4200, PREFERS_REDUCED ? 250 : 1700 + 500*Math.max(0,hops-1)) };
    station = i;
    paintDots();
    lastMove = performance.now();
    hint.style.opacity = 0;
  }

  function frameAt(s){
    const i = Math.max(0, Math.min(N_ST-2, Math.floor(s)));
    const f = s - i;
    const t = tSt[i] + (tSt[i+1] - tSt[i]) * f;
    const pos = camCurve.getPointAt(Math.max(0, Math.min(1, t)));
    const look = ST[i].look.clone().lerp(ST[i+1].look, smooth(f));
    return { pos, look };
  }

  // input: wheel
  let wheelAcc = 0, wheelT = 0;
  window.addEventListener('wheel', e=>{
    if (!started || menu.classList.contains('open')) return;
    const now = performance.now();
    if (now - wheelT > 600) wheelAcc = 0;
    wheelT = now;
    wheelAcc += e.deltaY;
    if (!anim && Math.abs(wheelAcc) > 60){
      goTo(station + (wheelAcc > 0 ? 1 : -1));
      wheelAcc = 0;
    }
  }, { passive:true });
  // input: touch swipe
  let touchY = null;
  window.addEventListener('touchstart', e=>{ touchY = e.touches[0].clientY; }, { passive:true });
  window.addEventListener('touchend', e=>{
    if (!started || touchY === null || menu.classList.contains('open')) return;
    const dy = touchY - e.changedTouches[0].clientY;
    if (Math.abs(dy) > 46 && !anim) goTo(station + (dy > 0 ? 1 : -1));
    touchY = null;
  }, { passive:true });
  // input: keys
  window.addEventListener('keydown', e=>{
    if (!started || menu.classList.contains('open')) return;
    if (['ArrowDown','ArrowRight','PageDown',' '].includes(e.key)) goTo(station+1);
    if (['ArrowUp','ArrowLeft','PageUp'].includes(e.key)) goTo(station-1);
  });

  c2 = {
    begin(){ setTimeout(()=> goTo(1), 700); },
    update(t, dt){
      if (anim){
        const u = Math.min(1, (performance.now() - anim.start) / anim.dur);
        sCur = anim.from + (anim.to - anim.from) * ease(u);
        if (u >= 1){ sCur = anim.to; anim = null; }
      }
      progress = sCur / (N_ST - 1);

      const fr = frameAt(sCur);
      camera.position.set(
        fr.pos.x + px * 0.9,
        fr.pos.y + (PREFERS_REDUCED ? 0 : Math.sin(t*0.5)*0.1) - py * 0.5,
        fr.pos.z
      );
      camera.lookAt(fr.look.x - px * 0.6, fr.look.y - py * 0.8, fr.look.z);

      if (!PREFERS_REDUCED){
        for (const r of rings) r.rotation.z += r.userData.spin * dt;
        for (const m of coreRings) m.rotation[m.userData.axis] += m.userData.speed * dt;
        for (const p of parts){
          const u2 = p.userData;
          const ang = t * u2.speed + u2.phase;
          p.position.set(
            M.x + Math.cos(ang) * u2.R,
            u2.yOff + Math.sin(t * u2.yFreq + u2.phase) * u2.yAmp,
            M.z + Math.sin(ang) * u2.R
          );
          if (p.rotation) { p.rotation.x += u2.spin * dt * 0.6; p.rotation.y += u2.spin * dt; }
        }
        // data streams: flow toward the core
        const posA = stream.geometry.attributes.position;
        const vel = stream.userData.vel;
        for (let i=0;i<posA.count;i++){
          const ix = posA.getX(i), iy = posA.getY(i), iz = posA.getZ(i);
          const dx = M.x - ix, dy = M.y - iy, dz = M.z - iz;
          const d = Math.sqrt(dx*dx + dy*dy + dz*dz);
          if (d < 6){
            posA.setXYZ(i, M.x + (Math.random()-0.5)*160, -4 + Math.random()*30, M.z + (Math.random()-0.5)*160);
          } else {
            const s = vel[i] * dt / d;
            posA.setXYZ(i, ix + dx*s, iy + dy*s, iz + dz*s);
          }
        }
        posA.needsUpdate = true;
        for (const f of floaters){
          f.obj.position.y = f.baseY + Math.sin(t*0.55 + f.seed) * f.amp;
        }
      }
      return camera.position.z;
    }
  };
}

/* ============================================================
   ENTER FLOW
   ============================================================ */
document.querySelectorAll('.beginbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    if (started) return;
    MODE = parseInt(btn.dataset.mode, 10);
    started = true;

    if (MODE === 1){
      buildConcept1();
      document.body.classList.remove('locked');
      hintlabel.textContent = IS_TOUCH ? 'Swipe up to move' : 'Scroll to move';
    } else {
      buildConcept2();
      hintlabel.textContent = IS_TOUCH ? 'Swipe up to advance' : 'Scroll to advance';
      c2.begin();
    }
    lastMove = performance.now() - 6500; // hint appears ~2.5s after entering

    enterEl.classList.add('gone');
    audio.src = AUDIO_TRACKS[MODE];
    audio.volume = 0;
    audio.play().then(()=>{
      let v = 0;
      const fade = setInterval(()=>{
        v = Math.min(0.85, v + 0.03);
        audio.volume = v;
        if (v >= 0.85) clearInterval(fade);
      }, 90);
    }).catch(()=>{ soundbtn.textContent = 'Sound off'; soundbtn.setAttribute('aria-pressed','false'); });
  });
});

/* ============================================================
   SHARED RENDER LOOP
   ============================================================ */
const v3 = new THREE.Vector3();
const v3b = new THREE.Vector3();
const camDir = new THREE.Vector3();
const clock = new THREE.Clock();
let lastT = 0;

function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = Math.min(Math.max(t - lastT, 0.001), 0.05);
  lastT = t;

  px += (pxT - px) * 0.04;
  py += (pyT - py) * 0.04;

  let camZ = camera.position.z;
  if (MODE === 1 && c1) camZ = c1.update(t, dt);
  else if (MODE === 2 && c2) camZ = c2.update(t, dt);

  // hint: re-show when idle mid-journey
  if (started && progress < 0.92 && performance.now() - lastMove > 9000){
    hint.style.opacity = 1;
  }

  // anchors — view-aware: true 3D distance + facing test (works on orbital paths)
  camera.getWorldDirection(camDir);
  const W = window.innerWidth, H = window.innerHeight;
  for (const a of anchors){
    v3.copy(a.pos).project(camera);
    if (v3.z > 1){ a.el.style.opacity = 0; continue; }
    v3b.subVectors(a.pos, camera.position);
    const dist = v3b.length();
    if (dist > a.range || dist < 0.001){ a.el.style.opacity = 0; continue; }
    const facing = v3b.divideScalar(dist).dot(camDir);
    const ff = Math.max(0, Math.min(1, (facing - 0.3) / 0.22));
    if (ff <= 0){ a.el.style.opacity = 0; continue; }
    const sx = (v3.x * 0.5 + 0.5) * W;
    const sy = (-v3.y * 0.5 + 0.5) * H;
    const scale = Math.min(a.maxScale, Math.max(0.12, a.base / dist));
    let op = 1;
    const fadeIn = a.range * 0.32;
    if (dist > a.range - fadeIn) op = (a.range - dist) / fadeIn;
    if (dist < 5.5) op = Math.max(0, (dist - 2) / 3.5);
    op *= ff;
    a.el.style.opacity = op.toFixed(3);
    a.el.style.transform = `translate(-50%,-50%) translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    a.el.style.pointerEvents = op > 0.5 ? '' : 'none';
  }

  progressBar.style.width = (progress*100).toFixed(2) + '%';
  if (MODE) renderer.render(scene, camera);
}
tick();

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
