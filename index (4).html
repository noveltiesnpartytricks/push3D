<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>PUSH — Brave is a strategy</title>
<meta name="description" content="PUSH. We give bold brands the intelligence to go further and waste nothing." />
<meta name="theme-color" content="#0b0716" />
<link rel="icon" href="https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781046778/PUSH-logo_dzxpsv.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --void:#0b0716;
    --purple:#8b75ff;
    --purple-soft:#a594ff;
    --amber:#ffb56b;
    --bone:#f4f1fb;
    --lav:#9b92c4;
    --display:'Archivo Black', sans-serif;
    --body:'Work Sans', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:auto}
  body{
    background:var(--void);
    color:var(--bone);
    font-family:var(--body);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body.locked{overflow:hidden}
  a{color:inherit}
  button{font-family:inherit}

  /* ---------- canvas + scroll spacer ---------- */
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0}
  #spacer{position:relative;width:100%;pointer-events:none}

  /* ---------- floating world-anchored text ---------- */
  #anchors{position:fixed;inset:0;z-index:2;pointer-events:none;overflow:hidden}
  .anchor{
    position:absolute;left:0;top:0;
    transform-origin:center center;
    will-change:transform,opacity;
    opacity:0;
    text-align:center;
    pointer-events:none;
  }
  .anchor .eyebrow{
    font-family:var(--body);font-weight:600;
    letter-spacing:.42em;text-transform:uppercase;
    font-size:13px;color:var(--purple-soft);
    margin-bottom:18px;
  }
  .anchor h2{
    font-family:var(--display);
    font-size:64px;line-height:1.02;
    letter-spacing:-.01em;
    text-shadow:0 0 60px rgba(139,117,255,.55), 0 0 18px rgba(139,117,255,.35);
  }
  .anchor .sub{
    font-size:19px;line-height:1.55;color:var(--lav);
    max-width:560px;margin:22px auto 0;
    font-weight:400;
  }
  .anchor.hero h2{font-size:88px}
  .anchor .stat{
    font-family:var(--display);font-size:44px;color:var(--amber);
    text-shadow:0 0 40px rgba(255,181,107,.55);
  }
  .anchor .statlabel{
    font-size:14px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--lav);margin-top:10px;font-weight:500;
  }
  .anchor .name{
    font-family:var(--display);font-size:26px;letter-spacing:.02em;
  }
  .anchor .role{
    font-size:13px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--lav);margin-top:8px;font-weight:500;
  }
  .anchor .word{
    font-family:var(--display);font-size:30px;color:var(--purple-soft);
    text-shadow:0 0 40px rgba(139,117,255,.6);
    letter-spacing:.02em;
  }
  .anchor .nodelabel{
    font-size:14px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--bone);font-weight:600;
    text-shadow:0 0 24px rgba(139,117,255,.8);
  }
  .anchor .cta{
    pointer-events:auto;
    display:inline-block;margin-top:34px;
    font-family:var(--body);font-weight:600;font-size:15px;
    letter-spacing:.22em;text-transform:uppercase;
    color:var(--void);background:var(--amber);
    padding:10px 4px;border-radius:999px;
    padding:18px 42px;text-decoration:none;
    box-shadow:0 0 60px rgba(255,181,107,.5);
    transition:transform .25s ease, box-shadow .25s ease, background .25s ease;
  }
  .anchor .cta:hover{transform:translateY(-2px);box-shadow:0 0 90px rgba(255,181,107,.8);background:#ffc488}
  .anchor .cta:focus-visible{outline:3px solid var(--bone);outline-offset:3px}
  .anchor .footlinks{
    pointer-events:auto;margin-top:26px;
    font-size:14px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;
    color:var(--lav);
  }
  .anchor .footlinks a{
    color:var(--purple-soft);text-decoration:none;margin:0 12px;
    border-bottom:1px solid rgba(165,148,255,.35);padding-bottom:3px;
  }
  .anchor .footlinks a:hover{color:var(--bone);border-color:var(--bone)}
  .anchor .legal{
    margin-top:26px;font-size:12px;color:rgba(155,146,196,.55);
    letter-spacing:.05em;max-width:460px;margin-left:auto;margin-right:auto;line-height:1.6;
  }

  /* ---------- chrome (fixed UI) ---------- */
  #chrome{position:fixed;inset:0;z-index:5;pointer-events:none}
  #brand{
    position:absolute;top:calc(26px + env(safe-area-inset-top, 0px));left:calc(28px + env(safe-area-inset-left, 0px));pointer-events:auto;
    display:flex;align-items:center;gap:12px;cursor:pointer;
    background:none;border:none;
  }
  #brand img{height:26px;display:block;filter:drop-shadow(0 0 14px rgba(139,117,255,.6))}
  #topright{
    position:absolute;top:calc(22px + env(safe-area-inset-top, 0px));right:calc(24px + env(safe-area-inset-right, 0px));pointer-events:auto;
    display:flex;align-items:center;gap:10px;
  }
  .pill{
    background:rgba(20,13,40,.55);
    border:1px solid rgba(165,148,255,.3);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    color:var(--bone);
    border-radius:999px;
    font-family:var(--body);font-weight:600;font-size:12px;
    letter-spacing:.2em;text-transform:uppercase;
    padding:12px 20px;cursor:pointer;
    transition:border-color .2s ease, background .2s ease;
  }
  .pill:hover{border-color:var(--purple-soft);background:rgba(40,28,80,.6)}
  .pill:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  #progress{
    position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:rgba(155,146,196,.12);
  }
  #progress i{
    display:block;height:100%;width:0%;
    background:linear-gradient(90deg,var(--purple),var(--amber));
    box-shadow:0 0 14px rgba(255,181,107,.6);
    transition:none;
  }
  #hint{
    position:absolute;bottom:calc(34px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);
    font-size:12px;letter-spacing:.4em;text-transform:uppercase;color:var(--lav);
    font-weight:600;opacity:0;transition:opacity 1s ease;
    display:flex;flex-direction:column;align-items:center;gap:10px;
  }
  #hint::after{
    content:"";width:1px;height:34px;
    background:linear-gradient(180deg,var(--purple-soft),transparent);
    animation:drip 2s ease-in-out infinite;
  }
  @keyframes drip{0%{transform:scaleY(.2);transform-origin:top}55%{transform:scaleY(1);transform-origin:top}100%{transform:scaleY(.2);transform-origin:top;opacity:0}}

  /* ---------- menu ---------- */
  #menu{
    position:fixed;inset:0;z-index:8;
    background:rgba(11,7,22,.94);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    opacity:0;visibility:hidden;transition:opacity .35s ease, visibility .35s;
  }
  #menu.open{opacity:1;visibility:visible}
  #menu nav{display:flex;flex-direction:column;align-items:center;gap:6px}
  #menu nav button{
    background:none;border:none;cursor:pointer;
    font-family:var(--display);font-size:34px;color:var(--bone);
    padding:8px 16px;letter-spacing:.01em;
    transition:color .2s ease, text-shadow .2s ease;
  }
  #menu nav button:hover{color:var(--amber);text-shadow:0 0 40px rgba(255,181,107,.6)}
  #menu nav button:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
  #menu .ext{
    margin-top:36px;display:flex;gap:28px;
    font-size:13px;letter-spacing:.25em;text-transform:uppercase;font-weight:600;
  }
  #menu .ext a{color:var(--purple-soft);text-decoration:none;border-bottom:1px solid rgba(165,148,255,.3);padding-bottom:4px}
  #menu .ext a:hover{color:var(--bone)}
  #menuclose{position:absolute;top:22px;right:24px}

  /* ---------- enter screen ---------- */
  #enter{
    position:fixed;inset:0;z-index:10;
    background:radial-gradient(120% 90% at 50% 110%, #1c1038 0%, var(--void) 60%);
    display:flex;flex-direction:column;justify-content:center;align-items:center;gap:0;
    transition:opacity 1.4s ease, visibility 1.4s;
  }
  #enter.gone{opacity:0;visibility:hidden}
  #enter img{height:54px;filter:drop-shadow(0 0 30px rgba(139,117,255,.7));margin-bottom:34px}
  #enter .tag{
    font-size:13px;letter-spacing:.45em;text-transform:uppercase;
    color:var(--lav);font-weight:600;margin-bottom:46px;text-align:center;line-height:2;
  }
  #begin{
    background:none;color:var(--bone);
    border:1px solid rgba(165,148,255,.5);
    border-radius:999px;padding:20px 64px;cursor:pointer;
    font-family:var(--body);font-weight:600;font-size:14px;
    letter-spacing:.35em;text-transform:uppercase;
    transition:all .3s ease;
  }
  #begin:hover{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 0 70px rgba(139,117,255,.7)}
  #begin:focus-visible{outline:2px solid var(--amber);outline-offset:4px}
  #enter .soundnote{margin-top:26px;font-size:12px;color:rgba(155,146,196,.7);letter-spacing:.15em;text-transform:uppercase;font-weight:500}

  /* ---------- responsive ---------- */
  @media (max-width:740px){
    .anchor h2{font-size:38px}
    .anchor.hero h2{font-size:46px}
    .anchor .sub{font-size:16px;max-width:82vw;margin-top:16px}
    .anchor .stat{font-size:30px}
    .anchor .word{font-size:20px}
    .anchor .name{font-size:18px}
    .anchor .role{font-size:10px;letter-spacing:.16em}
    .anchor .nodelabel{font-size:10px;letter-spacing:.2em}
    .anchor .eyebrow{font-size:10px;letter-spacing:.32em;margin-bottom:12px}
    .anchor .cta{padding:15px 32px;font-size:13px;margin-top:24px}
    #brand{top:20px;left:18px}
    #brand img{height:20px}
    #topright{top:16px;right:14px}
    .pill{padding:10px 15px;font-size:11px}
    #menu nav button{font-size:26px}
    #enter img{height:40px}
    #enter .tag{font-size:11px;letter-spacing:.35em;padding:0 24px}
  }
  @media (prefers-reduced-motion:reduce){
    #hint::after{animation:none}
  }
</style>
</head>
<body class="locked">

<canvas id="scene"></canvas>
<div id="spacer"></div>
<div id="anchors" aria-hidden="false"></div>

<div id="chrome">
  <button id="brand" aria-label="PUSH — back to start">
    <img src="https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781046778/PUSH-logo_dzxpsv.svg" alt="PUSH" />
  </button>
  <div id="topright">
    <button class="pill" id="soundbtn" aria-pressed="true">Sound on</button>
    <button class="pill" id="menubtn" aria-haspopup="true">Menu</button>
  </div>
  <div id="hint"><span id="hintlabel">Scroll</span></div>
  <div id="progress" aria-hidden="true"><i></i></div>
</div>

<div id="menu" role="dialog" aria-label="Navigation">
  <button class="pill" id="menuclose">Close</button>
  <nav id="menulinks"></nav>
  <div class="ext">
    <a href="https://push.agency/news/" target="_blank" rel="noopener">PUSH News</a>
    <a href="https://push.agency/push-post/" target="_blank" rel="noopener">PUSH Post</a>
    <a href="https://push.agency/contact/" target="_blank" rel="noopener">Contact</a>
  </div>
</div>

<div id="enter">
  <img src="https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781046778/PUSH-logo_dzxpsv.svg" alt="PUSH" />
  <div class="tag">An immersive experience<br/>concept</div>
  <button id="begin">Begin</button>
  <div class="soundnote">Best with sound</div>
</div>

<audio id="soundtrack" src="https://res.cloudinary.com/du8ydfy3a/video/upload/q_auto/f_auto/v1781048274/Starlit_Threshold_bdueqy.mp3" loop preload="auto"></audio>

<script type="module">
import * as THREE from 'https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.module.min.js';

/* ============================================================
   PUSH — "The Dark Field" / Strategy B demo
   A scroll journey through violet fog toward a warm horizon.
   ============================================================ */

const PREFERS_REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const IS_MOBILE = Math.min(window.innerWidth, window.innerHeight) < 740;

/* ---------- Cloudinary helpers ---------- */
const cld = (url, t) => url.replace('/upload/', '/upload/' + t + '/');

const WORK = [
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047082/work1_hdryd4.jpg', stat:'+574%', label:'Click-through rate' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work2_frxuy3.jpg', stat:'−96%', label:'Cost per store visit' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work3_yh4pre.jpg', stat:'+250%', label:'Engagement' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047081/work4_fkkhtr.jpg', stat:'−30%', label:'Cost per lead' },
];
const TEAM = [
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/1Kyle_qyyreh.jpg',  name:'Kyle',   role:'Founder & CEO' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/2Braden_o5zjxc.jpg', name:'Braden', role:'Chief Operating Officer' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/3Julie_bnwir1.jpg',  name:'Julie',  role:'President' },
  { url:'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047326/4Jason_dqbdkn.jpg',  name:'Jason',  role:'Chief Strategy Officer' },
];
const CLIENT_LOGOS = [
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047479/1logo_gmjppp.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047479/2logo_vvykjx.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047478/3logo_gxtcej.png',
  'https://res.cloudinary.com/du8ydfy3a/image/upload/q_auto/f_auto/v1781047478/4logo_oll2yb.png',
];

/* ---------- journey layout (z runs negative, forward) ---------- */
const Z_START = 10;
const Z_END   = -660;
const HORIZON_Z = -900;

/* ---------- renderer / scene ---------- */
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, alpha:false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_MOBILE ? 1.6 : 1.8));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0c0819);
scene.fog = new THREE.FogExp2(0x110b26, 0.0145);

const camera = new THREE.PerspectiveCamera(IS_MOBILE ? 70 : 58, window.innerWidth/window.innerHeight, 0.1, 1400);
camera.position.set(0, 2.6, Z_START);

/* ---------- shared textures ---------- */
function radialTexture(inner, outer){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(128,128,0,128,128,128);
  grad.addColorStop(0, inner);
  grad.addColorStop(1, outer);
  g.fillStyle = grad; g.fillRect(0,0,256,256);
  const t = new THREE.CanvasTexture(c);
  return t;
}
const TEX_GLOW_WARM   = radialTexture('rgba(255,196,140,1)','rgba(255,150,80,0)');
const TEX_GLOW_PURPLE = radialTexture('rgba(180,160,255,1)','rgba(120,90,255,0)');
const TEX_GLOW_SOFT   = radialTexture('rgba(255,255,255,1)','rgba(255,255,255,0)');

const texLoader = new THREE.TextureLoader();
texLoader.setCrossOrigin('anonymous');
function loadTex(url, cb){
  texLoader.load(url, (t)=>{ t.colorSpace = THREE.SRGBColorSpace; if(cb) cb(t); }, undefined, ()=>{});
}

/* ---------- ground ---------- */
{
  const geo = new THREE.PlaneGeometry(900, 1800);
  const mat = new THREE.MeshBasicMaterial({ color:0x130d28 });
  const ground = new THREE.Mesh(geo, mat);
  ground.rotation.x = -Math.PI/2;
  ground.position.set(0, -5.5, -500);
  scene.add(ground);
}

/* ---------- the horizon: a dawn you travel toward ---------- */
const horizon = new THREE.Group();
{
  const core = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_WARM, color:0xffc488, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
  core.scale.set(220, 220, 1);
  horizon.add(core);
  const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_PURPLE, color:0x8b75ff, transparent:true, opacity:0.45, blending:THREE.AdditiveBlending, depthWrite:false }));
  halo.scale.set(560, 420, 1);
  horizon.add(halo);
  const glowLow = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_WARM, color:0xff9d5c, transparent:true, opacity:0.5, blending:THREE.AdditiveBlending, depthWrite:false }));
  glowLow.scale.set(900, 200, 1);
  glowLow.position.y = -40;
  horizon.add(glowLow);
  horizon.position.set(0, 24, HORIZON_Z);
  scene.add(horizon);
  horizon.userData = { core, halo };
}

/* ---------- runway of warm lights (the path forward) ---------- */
const runway = [];
{
  for (let z = 0; z > HORIZON_Z + 60; z -= 11){
    const side = (runway.length % 2 === 0) ? 1 : -1;
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map:TEX_GLOW_WARM, color:0xffbe85, transparent:true,
      opacity:0.85, blending:THREE.AdditiveBlending, depthWrite:false
    }));
    s.scale.set(1.6, 1.6, 1);
    s.position.set(side * (2.6 + Math.sin(z*0.02)*0.5), -4.9, z);
    s.userData.seed = Math.random()*Math.PI*2;
    scene.add(s); runway.push(s);
  }
}

/* ---------- drifting particles (warm dust, rising = hope) ---------- */
let particles;
{
  const COUNT = IS_MOBILE ? 700 : 1500;
  const pos = new Float32Array(COUNT*3);
  const seeds = new Float32Array(COUNT);
  for (let i=0;i<COUNT;i++){
    pos[i*3]   = (Math.random()-0.5)*110;
    pos[i*3+1] = -5 + Math.random()*34;
    pos[i*3+2] = 30 - Math.random()*Math.abs(HORIZON_Z);
    seeds[i] = Math.random()*Math.PI*2;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    map:TEX_GLOW_SOFT, color:0xcdbfff, size:0.55, sizeAttenuation:true,
    transparent:true, opacity:0.7, blending:THREE.AdditiveBlending, depthWrite:false
  });
  particles = new THREE.Points(geo, mat);
  particles.userData.seeds = seeds;
  scene.add(particles);
}

/* ---------- a few large slow orbs for depth (soft, not blocky) ---------- */
const orbs = [];
{
  const spots = [
    [-18, 9, -90, 7, 0x8b75ff, .22], [22, 14, -150, 10, 0xffb56b, .15],
    [-26, 7, -300, 9, 0x8b75ff, .18], [20, 11, -430, 8, 0xffb56b, .14],
    [-16, 12, -560, 11, 0x8b75ff, .2],
  ];
  const OXF = IS_MOBILE ? 0.55 : 1;
  for (const [x,y,z,s,c,o] of spots){
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_PURPLE, color:c, transparent:true, opacity:o, blending:THREE.AdditiveBlending, depthWrite:false }));
    sp.scale.set(s*4, s*4, 1);
    sp.position.set(x*OXF,y,z);
    sp.userData.seed = Math.random()*6;
    scene.add(sp); orbs.push(sp);
  }
}

/* ---------- the method constellation (sec 04) ---------- */
const constellation = new THREE.Group();
const NXF = IS_MOBILE ? 0.45 : 1; // lateral compression for portrait viewports
const NODE_POINTS = [
  new THREE.Vector3(-9*NXF, 2.5, -178),
  new THREE.Vector3(-3.5*NXF, 5.2, -183),
  new THREE.Vector3(3.5*NXF, 3.0, -188),
  new THREE.Vector3(9*NXF, 6.0, -193),
];
{
  for (const p of NODE_POINTS){
    const n = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_PURPLE, color:0xb9aaff, transparent:true, opacity:0.95, blending:THREE.AdditiveBlending, depthWrite:false }));
    n.scale.set(3.4,3.4,1);
    n.position.copy(p);
    n.userData.seed = Math.random()*6;
    constellation.add(n);
  }
  const curve = new THREE.CatmullRomCurve3(NODE_POINTS);
  const tube = new THREE.Mesh(
    new THREE.TubeGeometry(curve, 48, 0.045, 6, false),
    new THREE.MeshBasicMaterial({ color:0x8b75ff, transparent:true, opacity:0.55, blending:THREE.AdditiveBlending, depthWrite:false })
  );
  constellation.add(tube);
  scene.add(constellation);
}

/* ---------- work panels: the luminous gallery ---------- */
const floaters = []; // everything that gently bobs: {obj, baseY, seed, amp}
function addPanel({url, x, y, z, w, h, rotY, glowColor=0x8b75ff, glowOp=0.4}){
  const group = new THREE.Group();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:TEX_GLOW_PURPLE, color:glowColor, transparent:true, opacity:glowOp, blending:THREE.AdditiveBlending, depthWrite:false }));
  glow.scale.set(w*2.1, h*2.3, 1);
  glow.position.z = -0.5;
  group.add(glow);
  const mat = new THREE.MeshBasicMaterial({ color:0x221b3d });
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);

  loadTex(url, (t)=>{ mat.map = t; mat.color.set(0xffffff); mat.needsUpdate = true; });
  group.position.set(x, y, z);
  group.rotation.y = rotY;
  scene.add(group);
  floaters.push({ obj:group, baseY:y, seed:Math.random()*6, amp:0.35 });
  return group;
}

const menu = document.getElementById('menu');
const menulinks = document.getElementById('menulinks');
function zToScroll(z){
  // place camera ~26 units before the section anchor
  const camZ = z + 26;
  const p = (Z_START - camZ) / (Z_START - Z_END);
  return Math.max(0, Math.min(1, p)) * maxScroll();
}
SECTIONS.forEach(s=>{
  const b = document.createElement('button');
  b.textContent = s.label;
  b.addEventListener('click', ()=>{
    menu.classList.remove('open');
    window.scrollTo({ top: zToScroll(s.z), behavior: PREFERS_REDUCED ? 'auto' : 'smooth' });
  });
  menulinks.appendChild(b);
});

document.getElementById('menuclose').addEventListener('click', ()=> menu.classList.remove('open'));

});

/* ============================================================
   SCROLL ENGINE — native scroll drives the camera
   ============================================================ */
const spacer = document.getElementById('spacer');
function maxScroll(){ return spacer.offsetHeight - window.innerHeight; }
function sizeSpacer(){
  const vh = window.innerHeight;
  spacer.style.height = Math.round(vh * (IS_MOBILE ? 16 : 14)) + 'px';
}
sizeSpacer();

let targetP = 0, currentP = 0;
function readScroll(){
  const m = maxScroll();
  targetP = m > 0 ? Math.min(1, Math.max(0, window.scrollY / m)) : 0;
}
window.addEventListener('scroll', ()=>{
  readScroll();
  lastMove = performance.now();
  hint.style.opacity = 0;
}, { passive:true });

/* pointer parallax (desktop nicety) */
let px = 0, py = 0, pxT = 0, pyT = 0;
window.addEventListener('pointermove', e=>{
  pxT = (e.clientX / window.innerWidth - 0.5) * 2;
  pyT = (e.clientY / window.innerHeight - 0.5) * 2;
}, { passive:true });

/* ============================================================
   ENTER / AUDIO
   ============================================================ */
const enterEl = document.getElementById('enter');
const audio = document.getElementById('soundtrack');
const soundbtn = document.getElementById('soundbtn');
const hint = document.getElementById('hint');
let started = false;

document.getElementById('hintlabel').textContent = ('ontouchstart' in window) ? 'Swipe up to move' : 'Scroll to move';
let lastMove = Infinity; // becomes real after Begin

document.getElementById('begin').addEventListener('click', ()=>{
  started = true;
  enterEl.classList.add('gone');
  document.body.classList.remove('locked');
  lastMove = performance.now() - 7000; // hint appears ~2s after entering
  audio.volume = 0;
  audio.play().then(()=>{
    // gentle fade-in
    let v = 0;
    const fade = setInterval(()=>{
      v = Math.min(0.85, v + 0.03);
      audio.volume = v;
      if (v >= 0.85) clearInterval(fade);
    }, 90);
  }).catch(()=>{ soundbtn.textContent = 'Sound off'; soundbtn.setAttribute('aria-pressed','false'); });
});
soundbtn.addEventListener('click', ()=>{
  if (audio.paused){ audio.play().catch(()=>{}); soundbtn.textContent='Sound on'; soundbtn.setAttribute('aria-pressed','true'); }
  else { audio.pause(); soundbtn.textContent='Sound off'; soundbtn.setAttribute('aria-pressed','false'); }
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const progressBar = document.querySelector('#progress i');
const v3 = new THREE.Vector3();
const clock = new THREE.Clock();

const SWAY = IS_MOBILE ? 1.1 : 2.2;
function pathX(z){ return Math.sin(z * 0.012) * SWAY; }

let lastT = 0;
function tick(){
  requestAnimationFrame(tick);
  const t = clock.getElapsedTime();
  const dt = Math.min(Math.max(t - lastT, 0.001), 0.05);
  lastT = t;

  // smooth scroll
  currentP += (targetP - currentP) * 0.065;
  if (Math.abs(targetP - currentP) < 0.00005) currentP = targetP;
  const camZ = Z_START + (Z_END - Z_START) * currentP;

  // hint: appears when idle, hides on movement, retires near the end
  if (started && currentP < 0.92 && performance.now() - lastMove > 9000){
    hint.style.opacity = 1;
  }

  // pointer parallax lerp
  px += (pxT - px) * 0.04;
  py += (pyT - py) * 0.04;

  camera.position.z = camZ;
  camera.position.x = pathX(camZ) + px * 1.4;
  camera.position.y = 2.6 + (PREFERS_REDUCED ? 0 : Math.sin(t*0.4)*0.12) - py * 0.7;
  camera.lookAt(pathX(camZ - 40), 3.4 - py * 1.2, camZ - 40);

  // ambient life
  if (!PREFERS_REDUCED){
    // particles drift up + shimmer
    const pos = particles.geometry.attributes.position;
    const seeds = particles.userData.seeds;
    for (let i=0;i<pos.count;i++){
      let y = pos.getY(i) + dt * 0.35;
      if (y > 30) y = -5;
      pos.setY(i, y);
      pos.setX(i, pos.getX(i) + Math.sin(t*0.3 + seeds[i]) * 0.004);
    }
    pos.needsUpdate = true;

    for (const f of floaters){
      f.obj.position.y = f.baseY + Math.sin(t*0.55 + f.seed) * f.amp;
    }
    for (const s of runway){
      s.material.opacity = 0.55 + Math.sin(t*1.4 + s.userData.seed) * 0.3;
    }
    for (const o of orbs){
      o.position.y += Math.sin(t*0.25 + o.userData.seed) * 0.002;
    }
    // horizon breathes, and warms as you approach
    const near = currentP; // 0 → 1
    horizon.userData.core.material.opacity = 0.75 + near*0.25 + Math.sin(t*0.6)*0.05;
    horizon.userData.halo.material.opacity = 0.35 + near*0.25;
  }

  // anchors: project world → screen
  const W = window.innerWidth, H = window.innerHeight;
  for (const a of anchors){
    v3.copy(a.pos).project(camera);
    const behind = v3.z > 1 || (a.pos.z > camZ - 1.5);
    if (behind){ a.el.style.opacity = 0; continue; }
    const dist = camZ - a.pos.z;
    if (dist > a.range){ a.el.style.opacity = 0; continue; }
    const sx = (v3.x * 0.5 + 0.5) * W;
    const sy = (-v3.y * 0.5 + 0.5) * H;
    const scale = Math.min(a.maxScale, Math.max(0.12, a.base / dist));
    // fade in over the last 30% of range, fade out very near
    let op = 1;
    const fadeIn = a.range * 0.32;
    if (dist > a.range - fadeIn) op = (a.range - dist) / fadeIn;
    if (dist < 7) op = Math.max(0, (dist - 2.5) / 4.5);
    a.el.style.opacity = op.toFixed(3);
    a.el.style.transform = `translate(-50%,-50%) translate(${sx.toFixed(1)}px, ${sy.toFixed(1)}px) scale(${scale.toFixed(3)})`;
    a.el.style.pointerEvents = op > 0.5 ? '' : 'none';
  }

  progressBar.style.width = (currentP*100).toFixed(2) + '%';
  renderer.render(scene, camera);
}
tick();

/* ---------- resize ---------- */
window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  sizeSpacer();
  readScroll();
});
</script>
